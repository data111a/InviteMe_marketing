<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Content-Security-Policy ships as an HTTP header — see public/_headers,
         vercel.json and public/.htaccess (the source of truth). If you deploy
         to a host that CANNOT set response headers (e.g. GitHub Pages),
         uncomment the <meta> below to apply the same policy. Keep the two in
         sync — especially connect-src / form-action once the contact form
         points at a real endpoint. See SECURITY.md.

    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-src https://*.inviteme.ge; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; form-action 'self'; manifest-src 'self'; upgrade-insecure-requests"
    />
    -->

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#f4f8fb" />

    <!-- Default meta. Each page overrides title/description via usePageMeta(). -->
    <title>InviteMe — ონლაინ მოსაწვევები</title>
    <meta
      name="description"
      content="InviteMe აკეთებს პერსონალურ ონლაინ მოსაწვევ გვერდებს ქორწილის, დაბადების დღისა და კორპორატიული ღონისძიებებისთვის."
    />
    <meta name="robots" content="index, follow" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="InviteMe" />
    <meta property="og:url" content="https://inviteme.ge/" />
    <meta property="og:image" content="https://inviteme.ge/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Basic structured data for search engines. Edit the details to match. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "InviteMe",
        "url": "https://inviteme.ge",
        "description": "Custom online invitation pages with RSVP forms and a private guest dashboard.",
        "email": "hello@inviteme.ge",
        "telephone": "+995 555 00 00 00",
        "areaServed": "GE",
        "availableLanguage": ["ka", "en"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
